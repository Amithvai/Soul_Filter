name: Update Soul Filter

on:
  schedule:
    - cron: "0 20 * * *"   # 03:00 WIB, harian
  workflow_dispatch:        # tombol run manual

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build filters
        run: python scripts/build.py

      - name: Commit & push if changed
        run: |
          git config user.name  "soul-filter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan, skip commit"
          else
            git commit -m "update filters $(date -u +%Y-%m-%d)"
            git push
          fi
